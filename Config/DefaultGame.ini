; ═══ LA TOOLCHAIN EMBARQUÉE PART AVEC LE JEU ═══ [GDD 18]
; « Embarquer compilateur, en-têtes et outils associés — plusieurs centaines de
; Mo à budgéter explicitement dans la distribution. »
;
; NON-UFS, et c'est TOUT le point : ces fichiers sont lus par `cl.exe`, pas par
; Unreal. Empaquetés en UFS ils finiraient dans un .pak, où aucun compilateur ne
; sait aller les chercher — ils doivent exister comme de VRAIS fichiers sur le
; disque du joueur.
; Les deux chemins sont RELATIFS À Content/ — c'est la convention de cette clé,
; et c'est pourquoi la toolchain vit sous Content/SP/Toolchain plutôt qu'à la
; racine du projet : un dossier hors Content/ ne serait tout simplement pas
; empaqueté par ce réglage.
;   Content/SP/Sdk        en-têtes de l'API + Kepler.cpp (283 Ko) — stage_sdk.py
;   Content/SP/Toolchain  MSVC Build Tools déposés par la distribution (~300 Mo+)
[/Script/UnrealEd.ProjectPackagingSettings]
+DirectoriesToAlwaysStageAsNonUFS=(Path="SP/Sdk")
+DirectoriesToAlwaysStageAsNonUFS=(Path="SP/Toolchain")
